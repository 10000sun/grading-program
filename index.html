<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>에바 수능 채점기</title>
<style>
:root{--bg:#fff;--fg:#1c1e21;--mut:#6b7280;--line:#e5e7eb;--acc:#2563eb;--bad:#dc2626;--ok:#16a34a;--card:#f8fafc}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e5e7eb;--mut:#9ca3af;--line:#2d3139;--acc:#60a5fa;--bad:#f87171;--ok:#4ade80;--card:#1b1e24}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Malgun Gothic",sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0 8px 0 0}
nav button{margin-right:4px}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
button{cursor:pointer}button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:16px;overflow-x:auto}
table{border-collapse:collapse;margin:8px 0}
th,td{border:1px solid var(--line);padding:3px 8px;text-align:center;white-space:nowrap}
th{background:var(--card)}td.l{text-align:left}
input.n{width:56px}input.a{width:260px}
.mut{color:var(--mut)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.bar{display:inline-block;height:10px;background:var(--acc);vertical-align:middle}
details{margin:8px 0}summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<header><h1>에바 수능 채점기</h1><nav id="nav"></nav><b id="total"></b></header>
<main id="main"></main>
<script src="xlsx.full.min.js"></script>
<script src="default-config.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
