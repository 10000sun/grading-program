<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>에바 수능 채점기</title>
<style>
:root{--bg:#fff;--fg:#1c1e21;--mut:#6b7280;--line:#e5e7eb;--acc:#2563eb;--bad:#dc2626;--ok:#16a34a;--card:#f8fafc}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e5e7eb;--mut:#9ca3af;--line:#2d3139;--acc:#60a5fa;--bad:#f87171;--ok:#4ade80;--card:#1b1e24}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,"Malgun Gothic",sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0 8px 0 0}
nav button{margin-right:4px}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
button{cursor:pointer}button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:16px;overflow-x:auto}
table{border-collapse:collapse;margin:8px 0}
th,td{border:1px solid var(--line);padding:3px 8px;text-align:center;white-space:nowrap}
th{background:var(--card)}td.l{text-align:left}
input.n{width:56px}input.a{width:260px}
.mut{color:var(--mut)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.bar{display:inline-block;height:10px;background:var(--acc);vertical-align:middle}
details{margin:8px 0}summary{cursor:pointer;font-weight:600}
.guide{background:var(--card);border-left:4px solid var(--acc);padding:10px 14px;border-radius:4px;margin:0 0 14px}
.help{color:var(--mut)}.help summary{font-weight:400}code{background:var(--card);padding:0 4px;border-radius:3px}
.badge{font-size:12px;font-weight:400;padding:1px 8px;border-radius:10px;border:1px solid currentColor;margin-left:6px}
.drop{display:block;border:2px dashed var(--acc);border-radius:10px;padding:28px 12px;text-align:center;cursor:pointer;margin:8px 0}
label.btn{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--card);cursor:pointer}
h3{margin:20px 0 4px;font-size:15px}
.ref{background:var(--card);border-left:4px solid var(--ok);padding:6px 12px;margin:6px 0;border-radius:4px}
.ref-inline{font-weight:400;color:var(--ok);margin-left:6px}
</style>
</head>
<body>
<header><h1>에바 수능 채점기</h1><nav id="nav"></nav><b id="total"></b><small id="net" class="mut"></small></header>
<main id="main"></main>
<script src="xlsx.full.min.js"></script>
<script src="default-config.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
