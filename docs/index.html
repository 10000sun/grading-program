<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>에바 수능 채점기</title>
<style>
:root{--bg:#eef1f7;--panel:#fff;--fg:#1d2433;--mut:#6b7385;--line:#dde3ee;--acc:#3b5bdb;--acc-soft:rgba(59,91,219,.09);--bad:#d63939;--ok:#1f9d55;--card:#f5f7fc;--head:#e9eefb;--headfg:#26345f;--shadow:0 2px 12px rgba(30,45,90,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--panel:#181c26;--fg:#e6e9f2;--mut:#98a1b5;--line:#2b3244;--acc:#7c93ff;--acc-soft:rgba(124,147,255,.14);--bad:#ff7a7a;--ok:#5fd68a;--card:#1f2432;--head:#242b3d;--headfg:#cfd8f5;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,"Malgun Gothic",sans-serif}
header{background:#243b8f;color:#fff;padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 10px rgba(30,45,90,.25)}
h1{font-size:18px;margin:0 10px 0 0;letter-spacing:-.3px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:5px 14px}
nav button:hover{background:rgba(255,255,255,.26)}
nav button.on{background:#fff;color:#2b3f9e;border-color:#fff;font-weight:700}
#total{margin-left:auto;background:rgba(255,255,255,.18);padding:3px 12px;border-radius:999px}
#net{color:rgba(255,255,255,.85)}
button,select,input,textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
button{cursor:pointer}button:hover{background:var(--acc-soft);border-color:var(--acc)}
button[data-act=del],button[data-act=clearAll]{color:var(--bad)}
button[data-act=exportXlsx]{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button[data-act=exportXlsx]:hover{filter:brightness(1.1)}
main{background:var(--panel);margin:16px auto;max-width:1400px;width:calc(100% - 32px);padding:20px 22px;border-radius:14px;box-shadow:var(--shadow);overflow-x:auto}
table{border-collapse:separate;border-spacing:0;margin:10px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 10px;text-align:center;white-space:nowrap}
th:last-child,td:last-child{border-right:0}tr:last-child td{border-bottom:0}
th{background:var(--head);color:var(--headfg);font-weight:700}td.l{text-align:left}
tbody tr:nth-child(even) td,table tr:nth-child(even) td{background:var(--card)}
table tr:hover td{background:var(--acc-soft)}
th.sh,.ct th{background:var(--c);color:#fff}
.ct{border-color:var(--c)}
td.sc{background:var(--c)!important;color:#fff;font-weight:700}
.gl{border-left:3px solid var(--c)!important}
td.tot{background:var(--acc-soft)!important;font-size:1.05em}
.rk1,.rk2,.rk3{font-weight:800}
td.rk1{background:#ffd43b!important;color:#5c4400}td.rk2{background:#ced4da!important;color:#343a40}td.rk3{background:#f4a261!important;color:#4a2a00}
input.n{width:60px}input.a{width:260px}
.mut{color:var(--mut)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.bar{display:inline-block;height:12px;background:var(--acc);border-radius:6px;vertical-align:middle}
details{margin:8px 0}summary{cursor:pointer;font-weight:600}
details.sj{border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:8px 14px;background:var(--card)}
details.sj[open]{background:var(--panel);box-shadow:var(--shadow)}
details.sj>summary{padding:2px 0}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--c);margin-right:8px;vertical-align:baseline}
.guide{background:var(--acc-soft);border-left:5px solid var(--acc);padding:11px 16px;border-radius:10px;margin:0 0 16px}
.help{color:var(--mut)}.help summary{font-weight:400}
code{background:var(--card);padding:1px 6px;border-radius:5px;border:1px solid var(--line)}
.badge{font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;border:1px solid currentColor;margin-left:6px}
.badge.ok{background:rgba(31,157,85,.12)}.badge.bad{background:rgba(214,57,57,.1)}
.drop{display:block;border:2px dashed var(--acc);background:var(--acc-soft);border-radius:14px;padding:34px 12px;text-align:center;cursor:pointer;margin:10px 0;font-weight:600}
.drop:hover{filter:brightness(.97)}
label.btn{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--panel);cursor:pointer}
h3.sec,h3{margin:26px 0 6px;font-size:16px;padding:2px 0 2px 12px;border-left:5px solid var(--acc)}
.sum b{color:var(--fg)}
.ref{background:rgba(31,157,85,.1);border-left:5px solid var(--ok);padding:8px 14px;margin:8px 0;border-radius:8px}
.ref-inline{font-weight:400;color:var(--ok);margin-left:8px}
.g{display:inline-block;min-width:24px;padding:0 9px;border-radius:999px;font-weight:700;font-size:.92em;margin:1px 2px}
.g1,.g2{background:#d3f9d8;color:#1b7a34}.g3,.g4{background:#d0ebff;color:#1864ab}.g5,.g6{background:#fff3bf;color:#7a5f00}.g7,.g8,.g9{background:#ffe3e3;color:#b92424}
table .cg,td.cg{background:#d3f9d8!important;color:#1b7a34;font-weight:600}
table .cm,td.cm{background:#fff3bf!important;color:#7a5f00;font-weight:600}
table .cb,td.cb{background:#ffe3e3!important;color:#b92424;font-weight:600}
table .cp,td.cp{background:var(--card)!important;color:var(--mut)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,label.drop:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.wrap{white-space:normal;max-width:280px;min-width:80px}
pre{background:var(--card);padding:10px;border-radius:8px;overflow:auto}
</style>
</head>
<body>
<header><h1>🎓 에바 수능 채점기</h1><nav id="nav"></nav><b id="total"></b><small id="net" class="mut"></small></header>
<main id="main"></main>
<script src="xlsx.full.min.js"></script>
<script src="exceljs.min.js"></script>
<script src="export.js"></script>
<script src="default-config.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
